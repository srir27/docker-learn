apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: deploy-flaskapp
spec:
  maxReplicas: 5
  metrics:
  - resource:
      name: cpu
      target:
        averageValue: 15m
        type: AverageValue
    type: Resource
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: deploy-flaskapp
status:
  currentMetrics: null
  desiredReplicas: 0
